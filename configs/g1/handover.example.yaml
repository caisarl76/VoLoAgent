  # between handover cycles in handover_bottle_261019 episodes 2-7 (19 Oct 2026).
  # Not yet reviewed on hardware.
  ready_right_arm_joints:
    right_shoulder_pitch_joint: -0.2287
    right_shoulder_roll_joint: -0.3292
    right_shoulder_yaw_joint: 0.0495
    right_elbow_joint: -0.3238
    right_wrist_roll_joint: 0.4396
    right_wrist_pitch_joint: 0.1176
    right_wrist_yaw_joint: -0.0919
