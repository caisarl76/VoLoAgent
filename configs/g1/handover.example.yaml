  # from the robot until the startup ready return completes, then bring it in: from
  # the recorded standing start pose the raised return touched a box 0.18-0.25 m away
  # (docs/artifacts/g1_handover_20261019_loop_sim). The pelvis height is estimated
  # from the measured legs at each ready return.
  desk_top_above_floor_m: 0.845
  desk_front_from_pelvis_m: 0.15
  # Simulation candidate from episode 30 frame 60; real swept path unqualified.
  raised_right_arm_joints:
    right_shoulder_pitch_joint: 0.01119326613843441
    right_shoulder_roll_joint: -0.681782603263855
    right_shoulder_yaw_joint: -0.5984442830085754
    right_elbow_joint: 0.16412396728992462
    right_wrist_roll_joint: 1.085878610610962
    right_wrist_pitch_joint: -0.15723302960395813
    right_wrist_yaw_joint: -0.48973536491394043
